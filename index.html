<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>품질검사 점검표 / Hoja de Inspección de Calidad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#eef2f6; --card:#ffffff; --ink:#0f172a; --muted:#5b6b7d; --line:#d7dee7;
    --head:#1e3a5f; --primary:#1d4ed8; --primary-d:#1e40af;
    --ok:#15803d; --ok-bg:#dcfce7; --ng:#dc2626; --ng-bg:#fee2e2; --ng-line:#fca5a5;
    --warn:#b45309; --warn-bg:#fef3c7; --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:"Malgun Gothic","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4}
  .es{display:block;font-size:.72em;color:var(--muted);font-weight:400;margin-top:1px}
  .hidden{display:none!important}

  header{position:sticky;top:0;z-index:30;background:var(--head);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  header h1{font-size:16px;margin:0;font-weight:800;line-height:1.15}
  header h1 small{display:block;font-size:11px;font-weight:500;color:#bcd0e6}
  .who{margin-left:auto;text-align:right;font-size:13px} .who b{display:block}
  .btn-logout{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
  .role-chip{display:inline-block;background:#0e2843;border-radius:6px;padding:1px 7px;font-size:11px;margin-top:2px}

  nav{position:sticky;top:54px;z-index:25;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto}
  nav button{flex:1 0 auto;min-width:90px;border:0;background:none;padding:12px 8px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  nav button.active{color:var(--primary);border-bottom-color:var(--primary)}

  main{max-width:760px;margin:0 auto;padding:14px 12px 90px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .sec-title{font-size:14px;font-weight:800;color:var(--head);margin:0 0 10px;padding-bottom:7px;border-bottom:2px solid #e6ecf3;display:flex;align-items:center;gap:6px}
  .sec-title .es{margin-top:0;display:inline;font-size:12px}

  label.fld{display:block;margin-bottom:11px}
  label.fld .lab{font-size:13px;font-weight:700;margin-bottom:5px;display:block}
  select,input,textarea{width:100%;font-family:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
  textarea{min-height:62px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ro{background:#f1f5f9;color:#334155;font-weight:600}

  .pick{position:relative}
  .pick-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:#fff;border:1.5px solid var(--primary);border-radius:10px;max-height:260px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.18)}
  .pick-list .opt{padding:10px 12px;border-bottom:1px solid #eef2f6;cursor:pointer}
  .pick-list .opt:active,.pick-list .opt.hl{background:#eff4ff}
  .pick-list .opt b{font-size:14px} .pick-list .opt small{display:block;color:var(--muted);font-size:12px}
  .pick-empty{padding:12px;color:var(--muted);font-size:13px}

  .jrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #eef2f6;flex-wrap:wrap}
  .jrow:first-of-type{border-top:0}
  .jlab{flex:1 1 120px;min-width:96px}
  .jlab .jname{font-size:14px;font-weight:700}
  .jref{font-size:11.5px;color:var(--primary);font-weight:700;margin-top:2px;min-height:0}
  .jval{width:108px;flex:none}
  .jpick{flex:1 1 150px}
  .jpick input{width:100%}
  .jbtns{display:flex;gap:6px;flex:none;margin-left:auto}
  .jbtn{width:60px;height:46px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:15px;font-weight:800;color:#94a3b8;cursor:pointer;transition:.08s}
  .jbtn.ok.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .jbtn.ng.on{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
  .cmt{flex-basis:100%;margin:2px 0 0;padding:9px;background:var(--ng-bg);border:1px solid var(--ng-line);border-radius:10px}
  .cmt label{font-size:12px;font-weight:800;color:var(--ng);display:block;margin-bottom:5px}
  .cmt textarea{border-color:var(--ng-line)}

  .result-box{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800}
  .badge{display:inline-block;padding:7px 16px;border-radius:999px;font-weight:800;font-size:16px}
  .badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.ng{background:var(--ng-bg);color:var(--ng)}
  .badge.sm{font-size:12px;padding:3px 10px}
  .badge.wait{background:#e0e7ff;color:#4338ca} .badge.appr{background:var(--ok-bg);color:var(--ok)} .badge.rej{background:var(--ng-bg);color:var(--ng)}

  .btn{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;color:#fff}
  .btn.primary{background:var(--primary)} .btn.primary:active{background:var(--primary-d)}
  .btn.ghost{background:#fff;color:var(--primary);border:2px solid var(--primary)}
  .btn.ok{background:var(--ok)} .btn.ng{background:var(--ng)}
  .btn.sm{padding:10px 14px;font-size:14px;width:auto}
  .btn:disabled{opacity:.55}
  .btn-row{display:flex;gap:10px}

  .seg{flex:1;border:0;background:#f1f5f9;color:var(--muted);border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer}
  .seg.on{background:var(--primary);color:#fff}

  .item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
  .item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .item .pn{font-weight:800;font-size:15px}
  .item .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
  .item .ngline{margin-top:8px;font-size:13px;background:var(--ng-bg);border-radius:8px;padding:7px 9px;color:#7f1d1d}
  .item .rej{margin-top:8px;font-size:13px;background:var(--warn-bg);border-radius:8px;padding:7px 9px;color:#7c2d12}

  .login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#1e3a5f,#0f2238)}
  .login-card{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:360px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .login-card h2{margin:0 0 2px;font-size:21px;color:var(--head)}
  .login-card p.sub{margin:0 0 20px;font-size:13px;color:var(--muted)}
  .login-card .err{background:var(--ng-bg);color:var(--ng);font-size:13px;padding:9px;border-radius:9px;margin-bottom:12px;font-weight:700}

  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .kpi .n{font-size:24px;font-weight:800} .kpi .l{font-size:11.5px;color:var(--muted);margin-top:2px}
  .kpi.danger .n{color:var(--ng)}
  .bar-row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
  .bar-row .bl{width:104px;font-weight:700;flex:none}
  .bar-track{flex:1;background:#eef2f6;border-radius:6px;height:20px;overflow:hidden}
  .bar-fill{height:100%;background:var(--ng);border-radius:6px}
  .bar-row .bn{width:34px;text-align:right;font-weight:800;flex:none}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}

  .drop{display:block;border:2px dashed var(--primary);border-radius:14px;padding:22px 14px;text-align:center;color:var(--primary);font-weight:700;background:#f5f8ff;cursor:pointer}
  .drop small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:6px}
  .prev-table,.mtbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  .prev-table th,.prev-table td,.mtbl th,.mtbl td{border:1px solid var(--line);padding:5px 6px;text-align:left;white-space:nowrap}
  .prev-table th,.mtbl th{background:#f1f5f9}
  .mtbl input,.mtbl select{padding:7px 8px;font-size:14px;border-radius:7px}
  .scroll-x{overflow-x:auto}
  .xbtn{border:0;background:#fee2e2;color:#dc2626;width:30px;height:30px;border-radius:8px;font-weight:800;cursor:pointer}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:13px 20px;border-radius:12px;font-weight:700;font-size:14px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
  .demo-flag{background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:700;text-align:center;padding:6px}
  .logo-head{height:28px;background:#fff;padding:3px 7px;border-radius:7px;display:block}
  .logo-login{display:block;height:46px;margin:0 auto 14px}
  @media (max-width:480px){ .jval{width:88px} .jbtn{width:52px} }
</style>
</head>

<script>

const CONFIG = { API_URL: "" };
const DEMO = !CONFIG.API_URL;

/* ================= 데모 메모리 ================= */
const demoDB = {

})();

/* ================= API ================= */
async function api(action, payload={}){
  if(DEMO){ await sleep(100); return demoApi(action, payload); }
  const res = await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...payload})});
  return await res.json();
}
function demoApi(action,p){
  const D=demoDB;
  switch(action){
    case "login":{ const u=D.users.find(x=>String(x.id)===String(p.id)&&String(x.pw)===String(p.pw));
      return u?{ok:true,user:{id:String(u.id),name:u.name,role:u.role,approverId:String(u.approverId||"")}}:{ok:false,msg:"사번 또는 비밀번호가 올바르지 않습니다 / No. empleado o contraseña incorrectos"};}
    case "masters": return {ok:true, products:D.products, machines:D.machines};
    case "getEmployees": return {ok:true, rows:D.users.map(u=>({id:String(u.id),name:u.name,pw:String(u.pw),role:u.role,approverId:String(u.approverId||"")}))};
    case "saveEmployees": D.users=(p.list||[]).filter(e=>String(e.id||"").trim()).map(e=>{const role=e.role||"inspector";return {id:String(e.id).trim(),pw:String(e.pw||"1234"),name:e.name||"",role,approverId:role==="inspector"?String(e.approverId||""):""};}); return {ok:true,count:D.users.length};
    case "saveMachines": D.machines=(p.list||[]).filter(m=>String(m.code||"").trim()).map(m=>({code:String(m.code).trim(),ton:String(m.ton||""),maker:String(m.maker||"")})); return {ok:true,count:D.machines.length};
    case "uploadProducts": D.products=p.products||[]; return {ok:true, count:D.products.length};
    case "addProduct": D.products.push(p.product); return {ok:true};
    case "submit":{ const id="INS"+(++D.seq), r=p.record;
      D.inspections.push({...r,id,ts:Date.now(),status:"상신",approver:"",rejectReason:"",decidedAt:0});
      (r.ngItems||[]).forEach(n=>D.ngLog.push({id:"NG"+(++D.seq),inspectionId:id,date:r.date,pn:r.pn,machine:r.machine,item:n.item,itemEs:n.itemEs,comment:n.comment,inspector:r.inspectorName,approverId:r.approverId||"",status:"상신"}));
      return {ok:true,id};}
    case "myList": return {ok:true, rows:D.inspections.filter(x=>String(x.inspectorId)===String(p.inspectorId)).sort((a,b)=>b.ts-a.ts)};
    case "pending": return {ok:true, rows:D.inspections.filter(x=>x.status==="상신"&&String(x.approverId)===String(p.approverId)).sort((a,b)=>a.ts-b.ts)};
    case "approve":{ const r=D.inspections.find(x=>x.id===p.id); if(r){r.status="승인";r.approver=p.approverName;r.decidedAt=Date.now();D.ngLog.filter(n=>n.inspectionId===p.id).forEach(n=>n.status="승인");} return {ok:true};}
    case "reject":{ const r=D.inspections.find(x=>x.id===p.id); if(r){r.status="반려";r.approver=p.approverName;r.rejectReason=p.reason;r.decidedAt=Date.now();} return {ok:true};}
    case "ngStats":{ let rows=D.ngLog.slice();
      if(p.approverId)rows=rows.filter(n=>String(n.approverId)===String(p.approverId));
      if(p.from)rows=rows.filter(n=>n.date>=p.from); if(p.to)rows=rows.filter(n=>n.date<=p.to);
      if(p.pn)rows=rows.filter(n=>n.pn===p.pn); if(p.machine)rows=rows.filter(n=>n.machine===p.machine); if(p.item)rows=rows.filter(n=>n.item===p.item);
      rows.sort((a,b)=>b.date.localeCompare(a.date)); return {ok:true,rows};}
  }
  return {ok:false,msg:"unknown action"};
}

/* ================= 유틸 ================= */
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function dstr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function tstr(d){return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function el(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstChild;}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add("hidden"),2600);}
const ROLE_KO={inspector:"검사자",approver:"승인자",developer:"개발자"};

/* 검사 항목 정의
   kind: 'judge'(OK/NG만) | 'value'(값+OK/NG) | 'search'(검색입력+OK/NG)
   ref : 선택 품번 마스터에서 가져올 기준값 키 (표시용) */

  {key:"app", ko:"외관",   es:"Apariencia", kind:"judge"},
  {key:"dim", ko:"치수",   es:"Dimensión",  kind:"value",  vlab:"측정값 / mm"},

  {key:"ct",  ko:"C/T",    es:"Ciclo",      kind:"value",  vlab:"측정값 / seg", ref:"ct",      refLab:"기준"},
  {key:"cav", ko:"Cavity", es:"Cavidad",    kind:"value",  vlab:"측정값",       ref:"cavity",  refLab:"기준"},
  {key:"mat", ko:"원재료", es:"Material",   kind:"search", vlab:"원재료 검색·입력", ref:"material", refLab:"기준"},
];
const STD_ITEMS=[
  {key:"stdWork", ko:"작업표준서", es:"Estándar de trabajo", kind:"judge"},
  {key:"stdCond", ko:"성형조건표", es:"Tabla de condiciones", kind:"judge"},

  {key:"s5s", ko:"3정5S 확인", es:"3정5S (Orden y limpieza)", kind:"judge"},
];
const ALL_ITEMS=[...INS_ITEMS,...STD_ITEMS,...EQ_ITEMS];
const VALUE_KEYS=INS_ITEMS.filter(it=>it.kind!=="judge").map(it=>it.key); // dim,wt,ct,cav,mat

let USER=null, MASTERS={products:[],machines:[]};

function materialOptions(){
  const set=new Set(); MASTERS.products.forEach(p=>{ if(p.material) set.add(p.material); });
  return [...set].sort();
}
function attachPicker(input, listBox, getItems, opt){
  function render(q){
    q=(q||"").trim().toLowerCase(); listBox.innerHTML="";
    let items=getItems(); if(q) items=items.filter(it=>opt.match(it,q));
    items=items.slice(0,40);
    if(!items.length){ if(!q){listBox.classList.add("hidden");return;} listBox.innerHTML=`<div class="pick-empty">검색 결과 없음 / Sin resultados</div>`;listBox.classList.remove("hidden");return; }
    items.forEach(it=>{ const o=el(opt.render(it)); o.onclick=()=>{opt.onPick(it);listBox.classList.add("hidden");}; listBox.appendChild(o); });
    listBox.classList.remove("hidden");
  }
  input.addEventListener("input",e=>{ if(opt.onInput)opt.onInput(e.target.value); render(e.target.value); });
  input.addEventListener("focus",e=>render(e.target.value));
  document.addEventListener("click",e=>{ if(!listBox.parentNode.contains(e.target)) listBox.classList.add("hidden"); });
}

/* ================= 로그인 ================= */
document.getElementById("demoHint").textContent = DEMO ? "데모: 1001(검사자) · 9001(승인자) · 9999(개발자)  비번 1234" : "";
document.getElementById("inPw").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});

async function doLogin(){
  const id=document.getElementById("inId").value.trim(), pw=document.getElementById("inPw").value;
  const errBox=document.getElementById("loginErr");
  if(!id||!pw){errBox.textContent="사번과 비밀번호를 입력하세요 / Ingrese No. empleado y contraseña";errBox.classList.remove("hidden");return;}
  const res=await api("login",{id,pw});
  if(!res.ok){errBox.textContent=res.msg||"로그인 실패";errBox.classList.remove("hidden");return;}
  errBox.classList.add("hidden"); USER=res.user;
  const m=await api("masters",{}); MASTERS={products:m.products||[],machines:m.machines||[]};
  enterApp();
}
function logout(){USER=null;document.getElementById("appView").classList.add("hidden");document.getElementById("loginView").classList.remove("hidden");document.getElementById("inPw").value="";}
function enterApp(){
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  if(DEMO)document.getElementById("demoFlag").classList.remove("hidden");
  document.getElementById("whoName").textContent=USER.name+" ("+USER.id+")";
  document.getElementById("whoRole").textContent=ROLE_KO[USER.role]||USER.role;
  buildTabs();
}
function buildTabs(){
  let tabs=[];
  if(USER.role==="inspector") tabs=[{id:"input",ko:"검사 입력",es:"Inspección"},{id:"mine",ko:"내 이력",es:"Mis registros"}];
  else if(USER.role==="approver") tabs=[{id:"approve",ko:"결재함",es:"Aprobación"},{id:"stats",ko:"NG 집계",es:"Estad. NG"}];
  else if(USER.role==="developer") tabs=[{id:"masters",ko:"마스터 관리",es:"Maestros"},{id:"stats",ko:"NG 집계",es:"Estad. NG"}];
  else tabs=[{id:"input",ko:"검사 입력",es:"Inspección"},{id:"mine",ko:"내 이력",es:"Mis registros"}];
  const nav=document.getElementById("tabs");nav.innerHTML="";
  tabs.forEach((t,i)=>{
    const b=el(`<button data-tab="${t.id}">${t.ko}<span class="es">${t.es}</span></button>`);
    b.onclick=()=>{[...nav.children].forEach(c=>c.classList.remove("active"));b.classList.add("active");route(t.id);};
    nav.appendChild(b); if(i===0)b.classList.add("active");
  });
  if(tabs[0]) route(tabs[0].id);
}
function route(tab){
  const s=document.getElementById("screen");s.innerHTML="";window.scrollTo(0,0);
  if(tab==="input")screenInput(s);
  else if(tab==="mine")screenMine(s);
  else if(tab==="approve")screenApprove(s);
  else if(tab==="stats")screenStats(s);
  else if(tab==="masters")screenMasters(s);
}
function activateTab(id){const b=document.querySelector(`#tabs [data-tab="${id}"]`);if(b){[...b.parentNode.children].forEach(c=>c.classList.remove("active"));b.classList.add("active");}}

/* 마스터 기준값을 검사항목 라벨 아래(.jref)에 표시 */
function applyRefs(insCard,p){
  INS_ITEMS.forEach(it=>{
    if(!it.ref) return;
    const refEl=insCard.querySelector(`[data-ref="${it.key}"]`); if(!refEl) return;
    const v=p?p[it.ref]:""; refEl.textContent=v?`${it.refLab} ${v}`:"";
  });
}

function makeItemRow(it,f,comments,onChange){
  const wrap=document.createElement("div");
  let valHtml="";
  if(it.kind==="value") valHtml=`<input class="jval" inputmode="decimal" placeholder="${it.vlab||'값'}" data-val="${it.key}">`;
  else if(it.kind==="search") valHtml=`<div class="pick jpick"><input class="jsearch" autocomplete="off" placeholder="${it.vlab||'검색'}" data-val="${it.key}"><div class="pick-list hidden"></div></div>`;
  const row=el(`<div class="jrow">
      <div class="jlab"><div class="jname">${it.ko} <span class="es">${it.es}</span></div><div class="jref" data-ref="${it.key}"></div></div>
      ${valHtml}
      <div class="jbtns"><button class="jbtn ok" data-j="OK">OK</button><button class="jbtn ng" data-j="NG">NG</button></div>
      <div class="cmt hidden"><label>NG 사유 (필수) / Motivo NG (obligatorio)</label><textarea data-cmt="${it.key}" placeholder="불량 내용을 입력하세요 / Describa el defecto"></textarea></div>
    </div>`);
  const cmt=row.querySelector(".cmt");
  row.querySelectorAll(".jbtn").forEach(btn=>{
    btn.onclick=()=>{
      const v=btn.dataset.j; f[it.key]=v;
      row.querySelector(".jbtn.ok").classList.toggle("on",v==="OK");
      row.querySelector(".jbtn.ng").classList.toggle("on",v==="NG");
      cmt.classList.toggle("hidden",v!=="NG");
      if(v!=="NG"){delete comments[it.key];cmt.querySelector("textarea").value="";}
      onChange();
    };
  });
  cmt.querySelector("textarea").oninput=e=>comments[it.key]=e.target.value.trim();
  if(it.kind==="search"){
    const input=row.querySelector(".jsearch"), listBox=row.querySelector(".pick-list");
    attachPicker(input,listBox,()=>materialOptions(),{match:(m,q)=>m.toLowerCase().includes(q),render:m=>`<div class="opt"><b>${esc(m)}</b></div>`,onPick:m=>{input.value=m;}});
  }
  wrap.appendChild(row);
  return wrap;
}

async function submitInspection(card,insCard,getSelected,f,comments,btn){
  const selected=getSelected();
  const machine=card.querySelector("#f_machine").value;
  const errs=[];
  if(!selected) errs.push("품번 / No. de parte");
  if(!machine) errs.push("생산호기 / No. de máquina");
  ALL_ITEMS.forEach(it=>{ if(f[it.key]===null) errs.push(`${it.ko} 판정`); });
  VALUE_KEYS.forEach(k=>{ const v=document.querySelector(`[data-val="${k}"]`); if(v&&!v.value.trim()){ const it=ALL_ITEMS.find(x=>x.key===k); errs.push(`${it.ko} 값`);} });
  const ngItems=[];
  ALL_ITEMS.forEach(it=>{ if(f[it.key]==="NG"){
    const c=(comments[it.key]||"").trim();
    if(!c) errs.push(`${it.ko} NG 코멘트`); else ngItems.push({item:it.ko,itemEs:it.es,comment:c});
  }});
  if(errs.length){toast("미입력: "+errs.slice(0,3).join(", ")+(errs.length>3?" 외":""));return;}

  const dt=card.querySelector("#f_dt").value.split(" ");
  const gv=k=>{const v=document.querySelector(`[data-val="${k}"]`);return v?v.value.trim():"";};
  const record={
    inspectorId:USER.id, inspectorName:USER.name, approverId:USER.approverId||"", date:dt[0], time:dt[1]||"",
    pn:selected.pn, name:selected.name||"", mold:selected.mold||"", machine,
    matStd:selected.material||"", ctStd:selected.ct||"", cavStd:selected.cavity||"", danjung:selected.danjung||"",
    app:f.app,
    dimVal:gv("dim"), dimJudge:f.dim, wtVal:gv("wt"), wtJudge:f.wt,
    ctVal:gv("ct"), ctJudge:f.ct, cavVal:gv("cav"), cavJudge:f.cav, matVal:gv("mat"), matJudge:f.mat,
    stdWork:f.stdWork, stdCond:f.stdCond, stdPack:f.stdPack, cam:f.cam, monitor:f.monitor, s5s:f.s5s,
    result: ALL_ITEMS.some(it=>f[it.key]==="NG")?"NG":"OK", ngItems,
  };
  btn.disabled=true;btn.textContent="상신 중...";
  const res=await api("submit",{record});
  btn.disabled=false;btn.textContent="결재 상신 / Enviar a aprobación";
  if(res.ok){toast("결재 상신 완료 / Enviado ✔");route("input");activateTab("input");}
  else toast("상신 실패 / Error al enviar");
}

function jv(val,judge){ const j=judge||"-"; const cls=judge==="NG"?"color:var(--ng);font-weight:800":(judge==="OK"?"color:var(--ok);font-weight:800":""); return `${esc(val||"-")}(<span style="${cls}">${j}</span>)`; }
function recordItem(r,showActions){
  const st={상신:"wait",승인:"appr",반려:"rej"}[r.status]||"wait";
  const stEs={상신:"Pendiente",승인:"Aprobado",반려:"Rechazado"}[r.status]||"";
  const node=el(`<div class="item">

    <div class="meta" style="margin-top:8px">외관 ${r.app||"-"} · 치수 ${jv(r.dimVal,r.dimJudge)} · 중량 ${jv(r.wtVal,r.wtJudge)}</div>
    <div class="meta" style="margin-top:3px">C/T ${jv(r.ctVal,r.ctJudge)} · Cav ${jv(r.cavVal,r.cavJudge)} · 원재료 ${jv(r.matVal,r.matJudge)}</div></div>`);
  const ngs=ngOf(r);
  if(ngs.length) node.appendChild(el(`<div class="ngline"><b>NG ${ngs.length}건</b> · ${ngs.map(n=>esc(n.item)+": "+esc(n.comment)).join(" / ")}</div>`));
  if(r.status==="반려"&&r.rejectReason) node.appendChild(el(`<div class="rej"><b>반려 사유 / Motivo:</b> ${esc(r.rejectReason)} (${esc(r.approver)})</div>`));
  if(showActions){
    const bar=el(`<div class="btn-row" style="margin-top:12px"><button class="btn ok sm" style="flex:1">승인 / Aprobar</button><button class="btn ng sm" style="flex:1">반려 / Rechazar</button></div>`);
    bar.children[0].onclick=async()=>{await api("approve",{id:r.id,approverId:USER.id,approverName:USER.name});toast("승인 완료 / Aprobado ✔");route("approve");activateTab("approve");};
    bar.children[1].onclick=async()=>{const reason=prompt("반려 사유를 입력하세요 / Motivo del rechazo:");if(reason===null||!reason.trim())return;await api("reject",{id:r.id,approverId:USER.id,approverName:USER.name,reason:reason.trim()});toast("반려 처리 / Rechazado");route("approve");activateTab("approve");};
    node.appendChild(bar);
  }
  return node;
}
function ngOf(r){ if(DEMO) return demoDB.ngLog.filter(n=>n.inspectionId===r.id); return r.ngItems||[]; }

async function runStats(filt,out){
  out.innerHTML=`<div class="empty">집계 중... / Calculando…</div>`;
  const params={from:filt.querySelector("#s_from").value,to:filt.querySelector("#s_to").value,pn:filt.querySelector("#s_pn").value.trim(),machine:filt.querySelector("#s_machine").value};
  if(USER.role==="approver") params.approverId=USER.id;
  const res=await api("ngStats",params);
  const rows=res.rows||[]; out.innerHTML="";
  const byItem={}, byMachine={};
  rows.forEach(n=>{byItem[n.item]=(byItem[n.item]||0)+1;byMachine[n.machine]=(byMachine[n.machine]||0)+1;});
  const topMachine=Object.entries(byMachine).sort((a,b)=>b[1]-a[1])[0];
  out.appendChild(el(`<div class="kpis">
    <div class="kpi danger"><div class="n">${rows.length}</div><div class="l">총 NG 건수<br>Total NG</div></div>
    <div class="kpi"><div class="n">${Object.keys(byItem).length}</div><div class="l">NG 항목 수<br>Ítems</div></div>
    <div class="kpi"><div class="n">${topMachine?esc(topMachine[0]):"-"}</div><div class="l">최다 발생 호기<br>Máquina top</div></div></div>`));
  if(!rows.length){out.appendChild(el(`<div class="empty">조건에 해당하는 NG 이력이 없습니다.<br><span class="es">Sin registros NG.</span></div>`));return;}
  const maxv=Math.max(...Object.values(byItem));
  const bars=el(`<div class="card"><h3 class="sec-title">검사항목별 NG <span class="es">/ NG por ítem</span></h3></div>`);
  Object.entries(byItem).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>bars.appendChild(el(`<div class="bar-row"><div class="bl">${esc(k)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxv*100)}%"></div></div><div class="bn">${v}</div></div>`)));
  out.appendChild(bars);
  const list=el(`<div class="card"><h3 class="sec-title">NG 상세 이력 <span class="es">/ Detalle (${rows.length})</span></h3></div>`);
  rows.forEach(n=>list.appendChild(el(`<div class="item" style="margin-bottom:8px">
    <div class="top"><div class="pn">${esc(n.pn)} <span class="badge sm ng">${esc(n.item)}</span></div><div class="meta" style="text-align:right">${esc(n.date)}<br>${esc(n.machine)}</div></div>
    <div class="ngline" style="margin-top:6px">${esc(n.comment)}</div><div class="meta" style="margin-top:5px">검사자 / Inspector: ${esc(n.inspector)}</div></div>`)));
  out.appendChild(list);
}

    if(!p.pn){toast("품번을 입력하세요 / Ingrese No. parte");return;}
    const res=await api("addProduct",{product:p});
    if(res.ok){const m=await api("masters",{});MASTERS={products:m.products||[],machines:m.machines||[]};toast("추가 완료 / Agregado ✔");renderProductMaster(body);}
    else toast("추가 실패 / Error");
  };

  let parsed=null;
  const up=el(`<div class="card">
    <h3 class="sec-title">엑셀 업로드 (전체 교체) <span class="es">/ Subir Excel</span></h3>
    <p style="font-size:13px;color:var(--muted);margin:0 0 12px">현재 등록 <b style="color:var(--ink)">${MASTERS.products.length.toLocaleString()}</b>건. 업로드한 양식(2024_MASTER) 그대로 인식합니다.</p>
    <label class="drop" for="mfile">📄 엑셀 파일 선택 / Seleccionar Excel (.xlsx)
      <small>품번·금형·MAQUINA TON·Cavity·품명·RESINA·단중·MASTER C/TIME 자동 매핑</small></label>
    <input id="mfile" type="file" accept=".xlsx,.xls" class="hidden"><div id="mprev"></div></div>`);
  body.appendChild(up);
  const fileInput=up.querySelector("#mfile"), prev=up.querySelector("#mprev");
  fileInput.onchange=async e=>{
    const file=e.target.files[0]; if(!file)return;
    prev.innerHTML=`<div class="empty">분석 중... / Analizando…</div>`;
    try{
      const buf=await file.arrayBuffer(), wb=XLSX.read(buf,{type:"array"});
      const wsName=wb.SheetNames.find(n=>/master/i.test(n))||wb.SheetNames[0];
      const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wsName],{header:1,defval:""});
      parsed=parseMaster(aoa);
      if(!parsed.length){prev.innerHTML=`<div class="empty" style="color:var(--ng)">유효한 품번을 찾지 못했습니다.<br><span class="es">No se encontraron productos.</span></div>`;return;}
      const head=parsed.slice(0,5); prev.innerHTML="";
      prev.appendChild(el(`<div style="margin-top:14px;font-weight:800;color:var(--head)">인식 결과: ${parsed.length.toLocaleString()}건</div>`));
      prev.appendChild(el(`<div class="scroll-x"><table class="prev-table"><thead><tr><th>품번</th><th>품명</th><th>금형</th><th>TON</th><th>Cav</th><th>원재료</th><th>C/T</th><th>단중</th></tr></thead>
        <tbody>${head.map(p=>`<tr><td>${esc(p.pn)}</td><td>${esc(p.name)}</td><td>${esc(p.mold)}</td><td>${esc(p.ton)}</td><td>${esc(p.cavity)}</td><td>${esc(p.material)}</td><td>${esc(p.ct)}</td><td>${esc(p.danjung)}</td></tr>`).join("")}</tbody></table></div>`));
      const btn=el(`<button class="btn primary" style="margin-top:12px">마스터 업로드 (${parsed.length.toLocaleString()}건 전체 교체)</button>`);
      btn.onclick=async()=>{
        if(!confirm(`기존 마스터를 새 ${parsed.length.toLocaleString()}건으로 교체합니다. 진행할까요?`))return;
        btn.disabled=true;btn.textContent="업로드 중...";
        const res=await api("uploadProducts",{products:parsed}); btn.disabled=false;
        if(res.ok){const m=await api("masters",{});MASTERS={products:m.products||[],machines:m.machines||[]};toast(`업로드 완료 / ${res.count||parsed.length}건 ✔`);renderProductMaster(body);}
        else{btn.textContent="업로드";toast("업로드 실패 / Error");}
      };
      prev.appendChild(btn);
    }catch(err){ prev.innerHTML=`<div class="empty" style="color:var(--ng)">파일 오류 / Error: ${esc(err)}</div>`; }
  };
}

/* ----- 직원 마스터 ----- */
async function renderEmployeeMaster(body){
  body.innerHTML=`<div class="empty">불러오는 중... / Cargando…</div>`;
  const res=await api("getEmployees",{}); const list=res.rows||[];
  const approvers=list.filter(e=>e.role==="approver");
  const apprOpts=`<option value="">— 담당 승인자 —</option>`+approvers.map(a=>`<option value="${esc(a.id)}">${esc(a.name)} (${esc(a.id)})</option>`).join("");
  const card=el(`<div class="card">
    <h3 class="sec-title">직원 마스터 <span class="es">/ Maestro de empleados</span></h3>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 8px">사번·이름·비번·권한·담당승인자 관리. 검사자에 담당 승인자를 지정하면 그 승인자만 결재합니다.<br>승인자를 먼저 만들어 <b>저장</b>한 뒤 검사자에 지정하세요. (개발자=마스터 관리)</p>
    <div class="scroll-x"><table class="mtbl"><thead><tr><th>사번</th><th>이름</th><th>비번</th><th>권한</th><th>담당 승인자</th><th></th></tr></thead><tbody id="empBody"></tbody></table></div>
    <div class="btn-row" style="margin-top:12px"><button class="btn ghost sm" id="empAdd">+ 직원 추가</button><button class="btn primary sm" id="empSave" style="flex:1">저장 / Guardar</button></div></div>`);
  body.innerHTML=""; body.appendChild(card);
  const tb=card.querySelector("#empBody");
  function addRow(e){
    const tr=el(`<tr>
      <td><input value="${esc(e?e.id:"")}" data-k="id" style="width:80px"></td>
      <td><input value="${esc(e?e.name:"")}" data-k="name" style="width:96px"></td>
      <td><input value="${esc(e?e.pw:"1234")}" data-k="pw" style="width:68px"></td>
      <td><select data-k="role"><option value="inspector">검사자</option><option value="approver">승인자</option><option value="developer">개발자</option></select></td>
      <td><select data-k="approverId">${apprOpts}</select></td>
      <td><button class="xbtn">✕</button></td></tr>`);
    const roleSel=tr.querySelector('[data-k="role"]'), apprSel=tr.querySelector('[data-k="approverId"]');
    roleSel.value=(e&&e.role)||"inspector";
    apprSel.value=(e&&e.approverId)||"";
    function sync(){ const isInsp=roleSel.value==="inspector"; apprSel.disabled=!isInsp; if(!isInsp)apprSel.value=""; apprSel.style.opacity=isInsp?"1":".4"; }
    roleSel.onchange=sync; sync();
    tr.querySelector(".xbtn").onclick=()=>tr.remove(); tb.appendChild(tr);
  }
  list.forEach(addRow); if(!list.length)addRow();
  card.querySelector("#empAdd").onclick=()=>addRow();
  card.querySelector("#empSave").onclick=async()=>{
    const out=[...tb.querySelectorAll("tr")].map(tr=>{const o={};tr.querySelectorAll("[data-k]").forEach(inp=>o[inp.dataset.k]=inp.value.trim());return o;}).filter(o=>o.id);
    if(!out.length){toast("최소 1명 이상 필요");return;}
    if(!out.some(o=>o.role==="developer")&&!confirm("개발자(마스터 관리자)가 없습니다. 계속할까요?"))return;
    const inspNoAppr=out.filter(o=>o.role==="inspector"&&!o.approverId);
    if(inspNoAppr.length&&!confirm(`담당 승인자가 없는 검사자 ${inspNoAppr.length}명이 있습니다. 이들은 결재 대상이 지정되지 않습니다. 계속할까요?`))return;
    const res=await api("saveEmployees",{list:out}); toast(res.ok?`저장 완료 / ${res.count}명 ✔`:"저장 실패");
  };
}

/* ----- 엑셀 파서 (2024_MASTER) ----- */
function parseMaster(aoa){
  const norm=s=>String(s==null?"":s).replace(/\s+/g," ").trim();
  let hr=-1;
  for(let i=0;i<Math.min(15,aoa.length);i++){ if(aoa[i].some(c=>/part\s*number/i.test(norm(c)))){hr=i;break;} }
  if(hr<0) return [];
  const H=aoa[hr].map(norm);
  const findIdx=re=>H.findIndex(h=>re.test(h));
  const resIdx=[]; H.forEach((h,i)=>{ if(/^resina$/i.test(h)) resIdx.push(i); });
  const idx={ pn:findIdx(/part\s*number/i), mold:findIdx(/^molde$/i), ton:findIdx(/maquina/i), cavity:findIdx(/cavity/i),
    name:findIdx(/part\s*name/i), material: resIdx.length>1?resIdx[1]:(resIdx.length?resIdx[0]:-1), ct:findIdx(/c\s*\/?\s*time/i), danjung:findIdx(/단중/) };
  const v=x=>norm(x), out=[];
  for(let i=hr+1;i<aoa.length;i++){
    const row=aoa[i]; if(!row)continue;
    const pn=norm(row[idx.pn]); if(!pn)continue;
    out.push({ pn, name:idx.name>=0?v(row[idx.name]):"", mold:idx.mold>=0?v(row[idx.mold]):"", ton:idx.ton>=0?v(row[idx.ton]):"",
      cavity:idx.cavity>=0?v(row[idx.cavity]):"", material:idx.material>=0?v(row[idx.material]):"", ct:idx.ct>=0?v(row[idx.ct]):"", danjung:idx.danjung>=0?v(row[idx.danjung]):"" });
  }
  return out;
}
