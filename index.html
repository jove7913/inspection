<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>품질검사 점검표 / Quality Inspection</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f3f1ee; --card:#ffffff; --ink:#1c1917; --muted:#6b6256; --line:#e3ddd4;
    --head:#2b2f36; --primary:#e8540e; --primary-d:#c2410c;
    --ok:#15803d; --ok-bg:#dcfce7; --ng:#dc2626; --ng-bg:#fee2e2; --ng-line:#fca5a5;
    --warn:#b45309; --warn-bg:#fef3c7; --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:"Malgun Gothic","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4}
  .hidden{display:none!important}
  header{position:sticky;top:0;z-index:30;background:var(--head);color:#fff;padding:9px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.18);border-bottom:3px solid var(--primary)}
  header h1{font-size:15px;margin:0;font-weight:800;line-height:1.15}
  header h1 small{display:block;font-size:11px;font-weight:500;color:#d8d2ca}
  .logo-head{height:26px;background:#fff;padding:3px 6px;border-radius:7px;display:block}
  .who{margin-left:auto;text-align:right;font-size:12px} .who b{display:block}
  .role-chip{display:inline-block;background:#15171b;border-radius:6px;padding:1px 7px;font-size:11px;margin-top:2px}
  .lang-sel{background:#15171b;color:#fff;border:1px solid #4a4f57;border-radius:8px;padding:7px 6px;font-size:12px;font-weight:700;width:auto}
  .btn-logout{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer}
  nav{position:sticky;top:52px;z-index:25;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto}
  nav button{flex:1 0 auto;min-width:96px;border:0;background:none;padding:12px 8px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  nav button.active{color:var(--primary);border-bottom-color:var(--primary)}
  main{max-width:820px;margin:0 auto;padding:14px 12px 90px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .sec-title{font-size:14px;font-weight:800;color:var(--head);margin:0 0 10px;padding-bottom:7px;border-bottom:2px solid #e6ecf3}
  label.fld{display:block;margin-bottom:11px}
  label.fld .lab{font-size:13px;font-weight:700;margin-bottom:5px;display:block}
  select,input,textarea{width:100%;font-family:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(232,84,14,.18)}
  textarea{min-height:60px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ro{background:#f1f5f9;color:#334155;font-weight:600}
  .pick{position:relative}
  .pick-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:#fff;border:1.5px solid var(--primary);border-radius:10px;max-height:260px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.18)}
  .pick-list .opt{padding:10px 12px;border-bottom:1px solid #eef2f6;cursor:pointer}
  .pick-list .opt b{font-size:14px} .pick-list .opt small{display:block;color:var(--muted);font-size:12px}
  .pick-empty{padding:12px;color:var(--muted);font-size:13px}
  .jrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #eef2f6;flex-wrap:wrap}
  .jrow:first-of-type{border-top:0}
  .jlab{flex:1 1 110px;min-width:90px}
  .jlab .jname{font-size:14px;font-weight:700}
  .jref{font-size:11.5px;color:var(--primary);font-weight:700;margin-top:2px}
  .jval{width:104px;flex:none}
  .jpick{flex:1 1 150px}
  .jpick input{width:100%}
  .jbtns{display:flex;gap:6px;flex:none;margin-left:auto}
  .jbtn{width:58px;height:46px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:15px;font-weight:800;color:#94a3b8;cursor:pointer}
  .jbtn.ok.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .jbtn.ng.on{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
  .cmt{flex-basis:100%;margin:2px 0 0;padding:9px;background:var(--ng-bg);border:1px solid var(--ng-line);border-radius:10px}
  .cmt label{font-size:12px;font-weight:800;color:var(--ng);display:block;margin-bottom:5px}
  .cmt textarea{border-color:var(--ng-line)}
  .result-box{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800}
  .badge{display:inline-block;padding:7px 16px;border-radius:999px;font-weight:800;font-size:16px}
  .badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.ng{background:var(--ng-bg);color:var(--ng)}
  .badge.sm{font-size:12px;padding:3px 10px}
  .badge.wait{background:#ffedd5;color:#9a3412} .badge.appr{background:var(--ok-bg);color:var(--ok)} .badge.rej{background:var(--ng-bg);color:var(--ng)}
  .btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;color:#fff}
  .btn.primary{background:var(--primary)} .btn.primary:active{background:var(--primary-d)}
  .btn.ghost{background:#fff;color:var(--primary);border:2px solid var(--primary)}
  .btn.ok{background:var(--ok)} .btn.ng{background:var(--ng)} .btn.green{background:#0f766e}
  .btn.sm{padding:10px 14px;font-size:14px;width:auto}
  .btn:disabled{opacity:.55}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .seg{flex:1;border:0;background:#f1f5f9;color:var(--muted);border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
  .seg.on{background:var(--primary);color:#fff}
  .item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
  .item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .item .pn{font-weight:800;font-size:15px}
  .item .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
  .item .ngline{margin-top:8px;font-size:13px;background:var(--ng-bg);border-radius:8px;padding:7px 9px;color:#7f1d1d}
  .item .rej{margin-top:8px;font-size:13px;background:var(--warn-bg);border-radius:8px;padding:7px 9px;color:#7c2d12}
  .login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#33373e,#1b1d21)}
  .login-card{background:#fff;border-radius:18px;padding:24px 22px;width:100%;max-width:360px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .login-card h2{margin:0 0 2px;font-size:21px;color:var(--head)}
  .login-card p.sub{margin:0 0 18px;font-size:13px;color:var(--muted)}
  .login-card .err{background:var(--ng-bg);color:var(--ng);font-size:13px;padding:9px;border-radius:9px;margin-bottom:12px;font-weight:700}
  .logo-login{display:block;height:44px;margin:0 auto 12px}
  .login-langs{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
  .login-langs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
  .login-langs button.on{border-color:var(--primary);color:var(--primary);background:#fff1e9}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .kpi .n{font-size:22px;font-weight:800} .kpi .l{font-size:11px;color:var(--muted);margin-top:2px}
  .kpi.danger .n{color:var(--ng)} .kpi.good .n{color:var(--ok)}
  .bar-row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
  .bar-row .bl{width:108px;font-weight:700;flex:none}
  .bar-track{flex:1;background:#eef2f6;border-radius:6px;height:20px;overflow:hidden}
  .bar-fill{height:100%;background:var(--ng);border-radius:6px}
  .bar-row .bn{width:34px;text-align:right;font-weight:800;flex:none}
  .empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px}
  .dtbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  .dtbl th,.dtbl td{border:1px solid var(--line);padding:6px 7px;text-align:left;white-space:nowrap}
  .dtbl th{background:#f1f5f9}
  .mtbl input,.mtbl select{padding:7px 8px;font-size:14px;border-radius:7px}
  .scroll-x{overflow-x:auto}
  .xbtn{border:0;background:#fee2e2;color:#dc2626;width:30px;height:30px;border-radius:8px;font-weight:800;cursor:pointer}
  .drop{display:block;border:2px dashed var(--primary);border-radius:14px;padding:20px 14px;text-align:center;color:var(--primary);font-weight:700;background:#fff5ef;cursor:pointer}
  .drop small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:13px 20px;border-radius:12px;font-weight:700;font-size:14px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
  .demo-flag{background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:700;text-align:center;padding:6px}
  @media (max-width:480px){ .jval{width:84px} .jbtn{width:50px} .kpis{grid-template-columns:repeat(2,1fr)} }
</style>
</head>

async function api(action, payload={}){
  if(DEMO){ await sleep(80); return demoApi(action, payload); }
  const res=await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...payload})});
  return await res.json();
}
function demoApi(action,p){
  const D=demoDB;
  switch(action){
    case "login":{ const u=D.users.find(x=>String(x.id)===String(p.id)&&String(x.pw)===String(p.pw));
      return u?{ok:true,user:{id:String(u.id),name:u.name,role:u.role,approverId:String(u.approverId||""),lang:u.lang||"ko"}}:{ok:false,msg:"INVALID_LOGIN"};}
    case "masters": return {ok:true, products:D.products, machines:D.machines};
    case "getEmployees": return {ok:true, rows:D.users.map(u=>({id:String(u.id),name:u.name,pw:String(u.pw),role:u.role,approverId:String(u.approverId||""),lang:u.lang||"ko"}))};
    case "saveEmployees": D.users=(p.list||[]).filter(e=>String(e.id||"").trim()).map(e=>{const role=e.role||"inspector";return {id:String(e.id).trim(),pw:String(e.pw||"1234"),name:e.name||"",role,approverId:role==="inspector"?String(e.approverId||""):"",lang:e.lang||"ko"};}); return {ok:true,count:D.users.length};
    case "saveMachines": D.machines=(p.list||[]).filter(m=>String(m.code||"").trim()).map(m=>({code:String(m.code).trim(),ton:String(m.ton||""),maker:String(m.maker||"")})); return {ok:true,count:D.machines.length};
    case "uploadProducts": D.products=p.products||[]; return {ok:true, count:D.products.length};
    case "addProduct": D.products.push(p.product); return {ok:true};
    case "submit":{ const id="INS"+(++D.seq), r=p.record;
      D.inspections.push({...r,id,ts:Date.now(),status:"상신",approver:"",rejectReason:"",decidedAt:0});
      (r.ngItems||[]).forEach(n=>D.ngLog.push({id:"NG"+(++D.seq),inspectionId:id,date:r.date,pn:r.pn,machine:r.machine,item:n.key,comment:n.comment,inspector:r.inspectorName,approverId:r.approverId||"",status:"상신"}));
      return {ok:true,id};}
    case "myList": return {ok:true, rows:D.inspections.filter(x=>String(x.inspectorId)===String(p.inspectorId)).sort((a,b)=>b.ts-a.ts)};
    case "pending": return {ok:true, rows:D.inspections.filter(x=>x.status==="상신"&&String(x.approverId)===String(p.approverId)).sort((a,b)=>a.ts-b.ts)};
    case "listInspections":{ let rows=D.inspections.slice();
      if(p.approverId)rows=rows.filter(x=>String(x.approverId)===String(p.approverId));
      if(p.from)rows=rows.filter(x=>String(x.date)>=p.from); if(p.to)rows=rows.filter(x=>String(x.date)<=p.to);
      rows.sort((a,b)=>b.ts-a.ts); return {ok:true,rows};}
    case "approve":{ const r=D.inspections.find(x=>x.id===p.id); if(r){r.status="승인";r.approver=p.approverName;r.decidedAt=Date.now();D.ngLog.filter(n=>n.inspectionId===p.id).forEach(n=>n.status="승인");} return {ok:true};}
    case "reject":{ const r=D.inspections.find(x=>x.id===p.id); if(r){r.status="반려";r.approver=p.approverName;r.rejectReason=p.reason;r.decidedAt=Date.now();} return {ok:true};}
    case "ngStats":{ let rows=D.ngLog.slice();
      if(p.approverId)rows=rows.filter(n=>String(n.approverId)===String(p.approverId));
      if(p.from)rows=rows.filter(n=>n.date>=p.from); if(p.to)rows=rows.filter(n=>n.date<=p.to);
      if(p.pn)rows=rows.filter(n=>n.pn===p.pn); if(p.machine)rows=rows.filter(n=>n.machine===p.machine);
      rows.sort((a,b)=>b.date.localeCompare(a.date)); return {ok:true,rows};}
  }
  return {ok:false,msg:"unknown"};
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function dstr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function tstr(d){return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function attachPicker(input, listBox, getItems, opt){
  function render(q){
    q=(q||"").trim().toLowerCase(); listBox.innerHTML="";
    let items=getItems(); if(q) items=items.filter(it=>opt.match(it,q));
    items=items.slice(0,40);
    if(!items.length){ if(!q){listBox.classList.add("hidden");return;} listBox.innerHTML=`<div class="pick-empty">—</div>`;listBox.classList.remove("hidden");return; }
    items.forEach(it=>{ const o=el(opt.render(it)); o.onclick=()=>{opt.onPick(it);listBox.classList.add("hidden");}; listBox.appendChild(o); });
    listBox.classList.remove("hidden");
  }
  input.addEventListener("input",e=>{ if(opt.onInput)opt.onInput(e.target.value); render(e.target.value); });
  input.addEventListener("focus",e=>render(e.target.value));
  document.addEventListener("click",e=>{ if(!listBox.parentNode.contains(e.target)) listBox.classList.add("hidden"); });
}

function buildTabs(){
  let tabs=[];
  if(USER.role==="inspector") tabs=[{id:"input"},{id:"mine"}];
  else if(USER.role==="approver") tabs=[{id:"approve"},{id:"report"}];
  else if(USER.role==="developer") tabs=[{id:"masters"},{id:"report"}];
  else tabs=[{id:"input"},{id:"mine"}];
  const nav=document.getElementById("tabs");nav.innerHTML="";
  const ids=tabs.map(x=>x.id);
  if(ids.indexOf(CURRENT_TAB)<0) CURRENT_TAB=ids[0];
  tabs.forEach(tb=>{
    const b=el(`<button data-tab="${tb.id}">${t("tab_"+tb.id)}</button>`);
    b.onclick=()=>{CURRENT_TAB=tb.id;[...nav.children].forEach(c=>c.classList.remove("active"));b.classList.add("active");route(tb.id);};
    if(tb.id===CURRENT_TAB)b.classList.add("active");
    nav.appendChild(b);
  });
  route(CURRENT_TAB);
}
function route(tab){
  const s=document.getElementById("screen");s.innerHTML="";window.scrollTo(0,0);
  if(tab==="input")screenInput(s);
  else if(tab==="mine")screenMine(s);
  else if(tab==="approve")screenApprove(s);
  else if(tab==="report")screenReport(s);
  else if(tab==="masters")screenMasters(s);
}

function makeItemRow(it,f,comments,onChange){
  const wrap=document.createElement("div");

  const row=el(`<div class="jrow">
      <div class="jlab"><div class="jname">${itemLabel(it.key)}</div><div class="jref" data-ref="${it.key}"></div></div>
      ${valHtml}
      <div class="jbtns"><button class="jbtn ok" data-j="OK">OK</button><button class="jbtn ng" data-j="NG">NG</button></div>
      <div class="cmt hidden"><label>${t("ngLabel")}</label><textarea data-cmt="${it.key}" placeholder="${t("ngPh")}"></textarea></div></div>`);
  const cmt=row.querySelector(".cmt");
  row.querySelectorAll(".jbtn").forEach(btn=>{
    btn.onclick=()=>{ const v=btn.dataset.j; f[it.key]=v;
      row.querySelector(".jbtn.ok").classList.toggle("on",v==="OK");
      row.querySelector(".jbtn.ng").classList.toggle("on",v==="NG");
      cmt.classList.toggle("hidden",v!=="NG");
      if(v!=="NG"){delete comments[it.key];cmt.querySelector("textarea").value="";}
      onChange();
    };
  });
  cmt.querySelector("textarea").oninput=e=>comments[it.key]=e.target.value.trim();
  if(it.kind==="search"){ const input=row.querySelector(".jsearch"), lb=row.querySelector(".pick-list");
    attachPicker(input,lb,()=>materialOptions(),{match:(m,q)=>m.toLowerCase().includes(q),render:m=>`<div class="opt"><b>${esc(m)}</b></div>`,onPick:m=>{input.value=m;}}); }
  wrap.appendChild(row); return wrap;
}
async function submitInspection(card,getSelected,f,comments,btn){
  const selected=getSelected();
  const machine=card.querySelector("#f_machine").value;
  const material=(document.querySelector('[data-val="mat"]')||{}).value?document.querySelector('[data-val="mat"]').value.trim():"";
  const errs=[];
  if(!selected) errs.push(t("fPn"));
  if(!machine) errs.push(t("machine"));
  ALL_ITEMS.forEach(it=>{ if(f[it.key]===null) errs.push(itemLabel(it.key)+" "+t("judge")); });
  VALUE_KEYS.forEach(k=>{ const v=document.querySelector(`[data-val="${k}"]`); if(v&&!v.value.trim()) errs.push(itemLabel(k)+" "+t("valueW")); });
  const ngItems=[];
  ALL_ITEMS.forEach(it=>{ if(f[it.key]==="NG"){ const c=(comments[it.key]||"").trim();
    if(!c) errs.push(itemLabel(it.key)+" "+t("ngc")); else ngItems.push({key:it.key,comment:c}); }});
  if(errs.length){toast(t("missing")+": "+errs.slice(0,3).join(", ")+(errs.length>3?" +":""));return;}
  const dt=card.querySelector("#f_dt").value.split(" ");
  const gv=k=>{const v=document.querySelector(`[data-val="${k}"]`);return v?v.value.trim():"";};
  const record={ inspectorId:USER.id, inspectorName:USER.name, approverId:USER.approverId||"", date:dt[0], time:dt[1]||"",
    pn:selected.pn, name:selected.name||"", mold:selected.mold||"", machine,
    matStd:selected.material||"", ctStd:selected.ct||"", cavStd:selected.cavity||"", danjung:selected.danjung||"",
    app:f.app, dimVal:gv("dim"), dimJudge:f.dim, wtVal:gv("wt"), wtJudge:f.wt,
    ctVal:gv("ct"), ctJudge:f.ct, cavVal:gv("cav"), cavJudge:f.cav, matVal:gv("mat"), matJudge:f.mat,
    stdWork:f.stdWork, stdCond:f.stdCond, stdPack:f.stdPack, cam:f.cam, monitor:f.monitor, s5s:f.s5s,
    result: ALL_ITEMS.some(it=>f[it.key]==="NG")?"NG":"OK", ngItems };
  btn.disabled=true;

function recordItem(r,showActions){

        <label class="fld"><span class="lab">${t("from")}</span><input type="date" id="r_from" value="${monthAgo}"></label>

        <label class="fld"><span class="lab">${t("fMachine")}</span><select id="r_machine"><option value="">${t("all")}</option>${MASTERS.machines.map(m=>`<option>${esc(m.code)}</option>`).join("")}</select></label>

      </div>

        <button class="btn primary sm" id="r_run" style="flex:1">${t("query")}</button>
        <button class="btn green sm" id="r_excel" style="flex:1">${t("excel")}</button>
      </div>
    </div>
    <div id="r_out"></div></div>`);
  root.appendChild(wrap);
  const segs=wrap.querySelectorAll(".seg"), out=wrap.querySelector("#r_out");
  let SEG="stats", lastRows=[], lastKind="";
  function filters(){ return {from:wrap.querySelector("#r_from").value,to:wrap.querySelector("#r_to").value,
    machine:wrap.querySelector("#r_machine").value,pn:wrap.querySelector("#r_pn").value.trim(),insp:wrap.querySelector("#r_insp").value.trim()}; }
  function clientFilter(list,fl){
    return list.filter(x=>(!fl.machine||x.machine===fl.machine)
      &&(!fl.pn||String(x.pn).toLowerCase().includes(fl.pn.toLowerCase()))
      &&(!fl.insp||String(x.inspectorName||x.inspector||"").toLowerCase().includes(fl.insp.toLowerCase())||String(x.inspectorId||"").includes(fl.insp)));
  }
  async function run(){
    out.innerHTML=`<div class="empty">${t("loading")}</div>`;
    const fl=filters(); const scope = USER.role==="approver"?{approverId:USER.id}:{};
    if(SEG==="ng"){
      const res=await api("ngStats",{...scope,from:fl.from,to:fl.to,pn:fl.pn,machine:fl.machine});
      let rows=(res.rows||[]).filter(n=>!fl.insp||String(n.inspector||"").toLowerCase().includes(fl.insp.toLowerCase()));
      lastRows=rows; lastKind="ng"; renderNG(out,rows);
    }else{
      const res=await api("listInspections",{...scope,from:fl.from,to:fl.to});
      let rows=clientFilter(res.rows||[],fl);
      if(SEG==="stats"){ const appr=rows.filter(x=>x.status==="승인"); lastRows=appr; lastKind="ins"; renderStats(out,appr); }
      else { const dec=rows.filter(x=>x.status==="승인"||x.status==="반려"); lastRows=dec; lastKind="ins"; renderHistory(out,dec); }
    }
  }
  segs.forEach(s=>s.onclick=()=>{SEG=s.dataset.seg;segs.forEach(x=>x.classList.toggle("on",x===s));run();});
  wrap.querySelector("#r_run").onclick=run;
  wrap.querySelector("#r_excel").onclick=()=>{ const fl=filters();
    if(lastKind==="ng") exportNG(lastRows,fl); else if(SEG==="stats") exportInspections(lastRows,fl,"stats"); else exportInspections(lastRows,fl,"history"); };
  run();
}
function renderStats(out,rows){
  out.innerHTML="";
  const total=rows.length, ng=rows.filter(r=>r.result==="NG").length, ok=total-ng;
  const rate=total?((ng/total)*100).toFixed(1):"0.0";
  out.appendChild(el(`<div class="kpis">
    <div class="kpi"><div class="n">${total}</div><div class="l">${t("totalIns")}</div></div>
    <div class="kpi good"><div class="n">${ok}</div><div class="l">OK</div></div>
    <div class="kpi danger"><div class="n">${ng}</div><div class="l">NG</div></div>
    <div class="kpi danger"><div class="n">${rate}%</div><div class="l">${t("defectRate")}</div></div></div>`));
  if(!total){out.appendChild(el(`<div class="empty">${t("noApproved")}</div>`));return;}
  const byPn={};
  rows.forEach(r=>{ const k=r.pn; if(!byPn[k])byPn[k]={ins:0,ng:0,name:r.name}; byPn[k].ins++; if(r.result==="NG")byPn[k].ng++; });
  const card=el(`<div class="card"><h3 class="sec-title">${t("byPart")}</h3>
    <div class="scroll-x"><table class="dtbl"><thead><tr><th>${t("fPn")}</th><th>${t("partName")}</th><th>${t("colIns")}</th><th>OK</th><th>NG</th><th>${t("colRate")}</th></tr></thead>
    <tbody>${Object.entries(byPn).sort((a,b)=>b[1].ng-a[1].ng).map(([pn,v])=>`<tr><td>${esc(pn)}</td><td>${esc(v.name||"")}</td><td>${v.ins}</td><td>${v.ins-v.ng}</td><td style="color:${v.ng?'var(--ng)':'inherit'};font-weight:700">${v.ng}</td><td>${((v.ng/v.ins)*100).toFixed(1)}%</td></tr>`).join("")}</tbody></table></div></div>`);
  out.appendChild(card);
}
function renderHistory(out,rows){
  out.innerHTML="";
  if(!rows.length){out.appendChild(el(`<div class="empty">${t("noHistory")}</div>`));return;}
  rows.forEach(r=>out.appendChild(recordItem(r,false)));
}
function renderNG(out,rows){
  out.innerHTML="";
  const byItem={}, byMachine={};
  rows.forEach(n=>{byItem[n.item]=(byItem[n.item]||0)+1;byMachine[n.machine]=(byMachine[n.machine]||0)+1;});
  const topM=Object.entries(byMachine).sort((a,b)=>b[1]-a[1])[0];
  out.appendChild(el(`<div class="kpis">
    <div class="kpi danger"><div class="n">${rows.length}</div><div class="l">${t("ngTotal")}</div></div>
    <div class="kpi"><div class="n">${Object.keys(byItem).length}</div><div class="l">${t("ngItemsCnt")}</div></div>
    <div class="kpi"><div class="n">${topM?esc(topM[0]):"-"}</div><div class="l">${t("topMachine")}</div></div>
    <div class="kpi"><div class="n">${rows.length}</div><div class="l">NG</div></div></div>`));
  if(!rows.length){out.appendChild(el(`<div class="empty">${t("noNg")}</div>`));return;}
  const maxv=Math.max(...Object.values(byItem));
  const bars=el(`<div class="card"><h3 class="sec-title">${t("perItemNg")}</h3></div>`);
  Object.entries(byItem).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>bars.appendChild(el(`<div class="bar-row"><div class="bl">${esc(itemLabel(k))}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxv*100)}%"></div></div><div class="bn">${v}</div></div>`)));
  out.appendChild(bars);
  const list=el(`<div class="card"><h3 class="sec-title">${t("ngDetail")} (${rows.length})</h3></div>`);
  rows.forEach(n=>list.appendChild(el(`<div class="item" style="margin-bottom:8px"><div class="top"><div class="pn">${esc(n.pn)} <span class="badge sm ng">${esc(itemLabel(n.item))}</span></div><div class="meta" style="text-align:right">${esc(n.date)}<br>${esc(n.machine)}</div></div><div class="ngline" style="margin-top:6px">${esc(n.comment)}</div><div class="meta" style="margin-top:5px">${t("inspectorLabel")}: ${esc(n.inspector)}</div></div>`)));
  out.appendChild(list);
}

  list.forEach(addRow); if(!list.length)addRow();
  card.querySelector("#empAdd").onclick=()=>addRow();
  card.querySelector("#empSave").onclick=async()=>{
    const out=[...tb.querySelectorAll("tr")].map(tr=>{const o={};tr.querySelectorAll("[data-k]").forEach(inp=>o[inp.dataset.k]=inp.value.trim());return o;}).filter(o=>o.id);
    if(!out.length){toast(t("saveFail"));return;}
    if(!out.some(o=>o.role==="developer")&&!confirm(t("needAppr")))return;
    const res=await api("saveEmployees",{list:out}); toast(res.ok?fmt("saved",res.count):t("saveFail"));
  };
}
function renderMachineMaster(body){
  const list=MASTERS.machines.map(m=>({code:m.code,ton:m.ton,maker:m.maker}));
  const card=el(`<div class="card"><h3 class="sec-title">${t("macTitle")}</h3>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 8px">${t("macNote")}</p>
    <div class="scroll-x"><table class="dtbl mtbl"><thead><tr><th>${t("cMac")}</th><th>${t("cTon")}</th><th>${t("cMaker")}</th><th></th></tr></thead><tbody id="macBody"></tbody></table></div>
    <div class="btn-row" style="margin-top:12px"><button class="btn ghost sm" id="macAdd">${t("macAdd")}</button><button class="btn primary sm" id="macSave" style="flex:1">${t("save")}</button></div></div>`);
  body.innerHTML=""; body.appendChild(card);
  const tb=card.querySelector("#macBody");
  function addRow(m){
    const tr=el(`<tr><td><input value="${esc(m?m.code:"")}" data-k="code" style="width:70px;text-transform:uppercase"></td>
      <td><input value="${esc(m?m.ton:"")}" data-k="ton" inputmode="numeric" style="width:70px"></td>
      <td><input value="${esc(m?m.maker:"")}" data-k="maker" style="width:120px"></td>
      <td><button class="xbtn">✕</button></td></tr>`);
    tr.querySelector(".xbtn").onclick=()=>tr.remove(); tb.appendChild(tr);
  }
  list.forEach(addRow); if(!list.length)addRow();
  card.querySelector("#macAdd").onclick=()=>addRow();
  card.querySelector("#macSave").onclick=async()=>{
    const out=[...tb.querySelectorAll("tr")].map(tr=>{const o={};tr.querySelectorAll("[data-k]").forEach(inp=>o[inp.dataset.k]=inp.value.trim());if(o.code)o.code=o.code.toUpperCase();return o;}).filter(o=>o.code);
    const res=await api("saveMachines",{list:out});
    if(res.ok){const m=await api("masters",{});MASTERS={products:m.products||[],machines:m.machines||[]};toast(fmt("saved",res.count));renderMachineMaster(body);}
    else toast(t("saveFail"));
  };
}

/* ----- 엑셀 파서 ----- */
function parseMaster(aoa){
  const norm=s=>String(s==null?"":s).replace(/\s+/g," ").trim();
  let hr=-1;
  for(let i=0;i<Math.min(15,aoa.length);i++){ if(aoa[i].some(c=>/part\s*number/i.test(norm(c)))){hr=i;break;} }
  if(hr<0) return [];
  const H=aoa[hr].map(norm), findIdx=re=>H.findIndex(h=>re.test(h));
  const resIdx=[]; H.forEach((h,i)=>{ if(/^resina$/i.test(h)) resIdx.push(i); });
  const idx={ pn:findIdx(/part\s*number/i), mold:findIdx(/^molde$/i), ton:findIdx(/maquina/i), cavity:findIdx(/cavity/i),
    name:findIdx(/part\s*name/i), material: resIdx.length>1?resIdx[1]:(resIdx.length?resIdx[0]:-1), ct:findIdx(/c\s*\/?\s*time/i), danjung:findIdx(/단중/) };
  const v=x=>norm(x), out=[];
  for(let i=hr+1;i<aoa.length;i++){ const row=aoa[i]; if(!row)continue; const pn=norm(row[idx.pn]); if(!pn)continue;
    out.push({ pn, name:idx.name>=0?v(row[idx.name]):"", mold:idx.mold>=0?v(row[idx.mold]):"", ton:idx.ton>=0?v(row[idx.ton]):"",
      cavity:idx.cavity>=0?v(row[idx.cavity]):"", material:idx.material>=0?v(row[idx.material]):"", ct:idx.ct>=0?v(row[idx.ct]):"", danjung:idx.danjung>=0?v(row[idx.danjung]):"" }); }
  return out;
}
